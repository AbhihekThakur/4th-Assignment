<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment-4_task-3</title>
    <link rel="stylesheet" href="style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    <div class="container">
        <nav>
            <div class="nav-box">
                <h5>Client</h5>
                <h5>Research</h5>
                <h5>Protfolio</h5>
                <h5>Podcast</h5>
            </div>
        </nav>
        <div class="hero">
            <h3>&#10019; &nbsp; About Me</h3>
            <div class="about-card">
                <div class="blue-card">
                    <div class= "image"><img src="./images/hero-image.png" alt=""></div>
                    <h2><span>Im,</span> <br> Jon <br> Daniel</h2>
                    <div class="email">
                        <p>inquiry@jondeniel.design</p>
                        <i class="ri-inbox-2-line"></i>
                    </div>
                    <div class="circuler-line">
                        <div class="back-circle">
                            <div class="base-circle" aria-label="My Design Portfolio">
                                <div class="inner-circle"></div>
                                <svg viewBox="0 0 120 120" aria-hidden="true">
                                    <defs>
                                        <!-- Top text bows down toward the centre of the badge. -->
                                        <path id="yearPath" d="M 40 35 A 25 25 0 0 1 80 35" />
                                        <!-- Bottom text follows the long, outward-facing lower curve. -->
                                        <path id="portfolioPath" d="M 25 43 C 1 58 20 110 60 108 C 90 108 122 78 100 40" />
                                    </defs>
                                    <text class="badge-year">
                                        <textPath href="#yearPath" startOffset="50%" text-anchor="middle">2022</textPath>
                                    </text>
                                    <text class="badge-portfolio" textLength="230">
                                        <textPath href="#portfolioPath">MY DESIGN PORTFOLIO</textPath>
                                    </text>
                                </svg>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="heading">
            <h1>protfolio</h1>
            <div class="corner"></div>
        </div>
        <div class="center-center">
            <div class="play">
                <i class="ri-play-fill"></i>
            </div>
            <div class="corner"></div>
        </div>
        <div class="right-center">
            <div class="box projects">
                <h3>251</h3>
                <p>Projects</p>
                 <div class="corner"></div>
            </div>
            <div class="box awards">
                <h3>156</h3>
                <p>Awards</p>
                 <div class="corner"></div>
            </div>
           
        </div>
        <div class="center-bottom">
            <div class="corner"></div>
            <i class="ri-apple-fill"></i>
            <p>Clients</p>
        </div>
        <div class="right-bottom">
            <div class="bottom-image">
                <img src="https://cdn.prod.website-files.com/66e1de5b5cd3dac09b29b111/66e482aeb1fbb1f422c32a0a_mo-U3Kst7MY4Ok-unsplash-transformed.png" alt="">
            </div>
            <div class="front">
                <h3>172</h3>
                <p>global design <br>awards.</p>
                <div class="corner"></div>
            </div>
        </div>
        
    </div>
</body>
</html>
